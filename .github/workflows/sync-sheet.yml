name: Sync fixtures from sheet

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_GIT_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Pull latest fixtures from Google Sheet
        run: npm run sync:sheet

      - name: Commit and push if the sheet changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/data/seed.js \
            src/data/division-colors.json \
            src/data/team-divisions.json \
            index.html \
            public/og-timetable.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No fixture changes"
            exit 0
          fi
          git commit -m "Sync fixtures from Google Sheet"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK secret; relying on the Git push for Vercel"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
